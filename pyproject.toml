[project]
name = "govsaathi"
version = "0.1.0"
description = "GovSaathi government scheme and tax information assistant"
readme = "README.md"
authors = [
    { name = "Priyanshi Saini", email = "sainipriyanshi372941@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    # Web framework and server
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "django>=6.1.1",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.4",

    # PostgreSQL and database access
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",

    # RAG and retrieval
    "langchain>=1.3.16",
    "langchain-community",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-huggingface>=1.2.2",
    "langchain-groq>=1.1.3",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.15.0",

    # ML, models, and embeddings
    "sentence-transformers>=6.0.0",
    "transformers>=5.15.1",
    "torch",

    # LLM and data ingestion
    "groq",
    "pypdf>=6.16.1",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "httpx>=0.28.1",

    # Optional development and evaluation
    "pytest>=9.1.1",
    "ragas>=0.4.3",
]
    
[tool.uv]
package = false